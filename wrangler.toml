name = "recall-dial"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Serves public/index.html (the R1 page) and public/install.html (the QR page).
# Requests to /api/* go to the worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
START_DATE = "2019-01-01"
TIMEZONE = "America/New_York"

# Secrets (set once, never committed):
#   npx wrangler secret put NOTION_TOKEN
#   npx wrangler secret put DIAL_KEY
