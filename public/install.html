<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Recall Dial</title>
<script src="qrcode.js"></script>
<style>
  :root { --bg:#f4f2ee; --ink:#0c0c0d; --mute:#6b6862; --accent:#fe5000; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0c0d; --ink:#f4f2ee; --mute:#8a8780; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 40px; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; font-weight: 800; }
  h1 span { color: var(--accent); }
  p { color: var(--mute); margin-top: 10px; }
  #qr { margin-top: 24px; background: #fff; padding: 16px; width: 100%; aspect-ratio: 1; }
  #qr svg { width: 100%; height: 100%; display: block; }
  .err { margin-top: 24px; padding: 12px; border: 1px solid var(--accent); }
  code { font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Recall<br><span>Dial</span></h1>
  <p>On the R1: open the creations card, tap “add via QR code,” and point it here.</p>
  <div id="out"></div>
</main>
<script>
  var params = new URLSearchParams(location.search);
  var k = params.get('k');
  var v = params.get('v') || '1';
  var out = document.getElementById('out');
  if (!k) {
    out.innerHTML = '<div class="err">Add your key to this page’s address: <code>?k=YOUR_DIAL_KEY</code></div>';
  } else {
    var url = location.origin + '/?k=' + encodeURIComponent(k) + '&v=' + encodeURIComponent(v);
    var payload = JSON.stringify({
      title: 'Recall Dial',
      url: url,
      description: 'One day of saves from the past, every day.',
      iconUrl: '',
      themeColor: '#FE5000'
    });
    var q = qrcode(0, 'M'); q.addData(payload); q.make();
    out.innerHTML = '<div id="qr">' + q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }) + '</div>' +
      '<p>To push an update to the R1, add <code>&amp;v=2</code> to this page’s address and rescan.</p>';
  }
</script>
</body>
</html>
